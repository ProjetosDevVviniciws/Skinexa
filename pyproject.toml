[project]
name = "skinexa"
version = "0.1.0"
description = ""
authors = [
    {name = "Vinícius Pinto Gonçalves",email = "vinip8372@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-login (>=0.6.3,<0.7.0)",
    "flask-wtf (>=1.3.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pymysql (>=1.2.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "skinexa", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = "^26.5.1"
isort = "^8.0.1"
flake8 = "^7.3.0"
responses = "^0.26.2"

